<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgive - Saint 𖤐 sinneR</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body style="background:#000 url('ravenn.png') center/cover no-repeat fixed; min-height:100vh;">
    
    <!-- HEADER -->
    <header class="fixed-header" style="padding:60px 0;">
        <div class="logo" style="font-size:48px; cursor:pointer;" onclick="location.href='index.html'">Saint 𖤐 sinneR</div>
        <div class="top-buttons">
            <button class="backrooms-btn" onclick="location.href='login.html'">Login</button>
            <button class="backrooms-btn" onclick="location.href='register.html'">Register</button>
        </div>
        <div class="main-buttons" style="top:110px;">
            <button class="backrooms-btn" onclick="location.href='index.html'">Main Page</button>
            <button class="backrooms-btn" onclick="location.href='countdown.html'">Countdown</button>
            <button class="backrooms-btn" onclick="alert('Blog coming soon')">Blog</button>
            <button class="backrooms-btn" onclick="location.href='forgive.html'">Forgive My Sins</button>
        </div>
    </header>
    
    <div class="modal-content" style="margin:10% auto; max-width:700px;">
        <h1 style="font-family:'Creepster',cursive; font-size:56px; color:#8B0000; text-shadow:0 0 20px #8B0000, 0 0 40px #FF0000; text-align:center; margin-bottom:30px;">
            CONFESS YOUR SINS
        </h1>
        <p style="text-align:center; color:#888; margin-bottom:30px; font-size:18px; font-style:italic;">
            The entities are listening... they remember everything...
        </p>
        
        <input type="text" id="nickname" placeholder="Your Church Nickname" 
               style="font-size:18px; width:100%; padding:15px; margin-bottom:20px; background:#1A1A1A; border:2px solid #8B0000; color:#fff; font-family:'Share Tech Mono', monospace;">
        
        <textarea id="reason" placeholder="Why do you seek forgiveness?" rows="5" 
                  style="font-size:18px; width:100%; padding:15px; margin-bottom:20px; background:#1A1A1A; border:2px solid #8B0000; color:#fff; font-family:'Share Tech Mono', monospace;"></textarea>
        
        <h3 style="font-size:32px; color:#fff; text-shadow:0 0 10px #8B0000; text-align:center; margin:30px 0;">
            Are you truly sorry?
        </h3>
        
        <div style="display:flex; gap:20px; justify-content:center; margin:30px 0;">
            <button class="glitch-btn" style="font-size:32px;" onclick="alert('Your sin has been noted...')">YES</button>
            <button class="glitch-btn" style="font-size:32px;" onclick="alert('There is no escape...')">NO</button>
        </div>
        
        <button class="glitch-btn" style="font-size:32px; width:100%;" onclick="alert('God has heard you... maybe')">
            God Forgive Me
        </button>
    </div>
</body>
</html>
