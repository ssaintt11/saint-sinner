<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown - Saint 𖤐 sinneR</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <!-- HEADER -->
    <header class="fixed-header">
        <div class="logo" style="font-size: 48px;">Saint 𖤐 sinneR</div>
        <button onclick="location.href='index.html'" style="position:absolute; top:20px; right:20px;">Main Page</button>
    </header>

    <!-- YAZI -->
    <div style="position:fixed; inset:0; display:flex; align-items:center; justify-content:center;">
        <div id="countdown-text" style="font-size:108px; font-family:'Creepster'; color:#fff; text-shadow:0 0 45px #8B0000;">BACKROOMS IS OUT!</div>
    </div>

    <!-- ARKAPLAN -->
    <div id="animated-background" style="position:fixed; inset:0; background:#000 url('backroooms.png') center/cover no-repeat; opacity:0; z-index:-1;"></div>

    <!-- ZAMANLAYICI -->
    <script>
        const text = document.getElementById('countdown-text');
        const bg = document.getElementById('animated-background');

        function effect() {
            setTimeout(() => {
                text.style.animation = 'flicker .5s 2';
                setTimeout(() => {
                    text.style.animation = '';
                    bg.style.opacity = '1';
                    bg.style.animation = 'flicker .5s 2';
                    setTimeout(() => {
                        bg.style.animation = '';
                        setTimeout(() => {
                            text.style.animation = 'flicker .5s 2';
                            bg.style.animation = 'flicker .5s 2';
                            setTimeout(() => {
                                text.style.animation = '';
                                bg.style.animation = '';
                                bg.style.opacity = '0';
                            }, 1000);
                        }, 500);
                    }, 500);
                }, 3000);
            }, 3500);
        }

        window.onload = () => setTimeout(effect, 1000);
        setInterval(effect, 8500);
    </script>

    <style>
        @keyframes flicker {
            0%,100%{opacity:1} 50%{opacity:.2}
        }
    </style>
</body>
</html>
