<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown - Saint 𖤐 sinneR</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- SUPABASE CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="auth.js"></script>
</head>
<body style="background:#000 url('ravenn.png') center/cover no-repeat fixed; min-height:100vh;">
    
    <!-- HEADER -->
    <header class="fixed-header" style="padding:60px 0;">
        <div class="logo" style="font-size:48px;" onclick="location.href='index.html'">Saint 𖤐 sinneR</div>
        <div class="top-buttons">
            <button class="backrooms-btn" onclick="location.href='login.html'">Login</button>
            <button class="backrooms-btn" onclick="location.href='register.html'">Register</button>
        </div>
        <div class="main-buttons" style="top:110px;">
            <button class="backrooms-btn" onclick="location.href='index.html'">Main Page</button>
            <button class="backrooms-btn" onclick="location.href='countdown.html'">Countdown</button>
            <button class="backrooms-btn" onclick="alert('Blog coming soon')">Blog</button>
            <button class="backrooms-btn" onclick="location.href='forgive.html'">Forgive My Sins</button>
        </div>
    </header>

    <!-- COUNTDOWN -->
    <div class="modal-content" style="margin:10% auto; max-width:600px; text-align:center;">
        <h2 style="font-size:48px; color:#fff; text-shadow:0 0 20px #8B0000; margin-bottom:30px; font-family:'Creepster',cursive;">
            THE BACKROOMS AWAIT
        </h2>
        
        <div id="countdown" style="font-size:72px; color:#8B0000; text-shadow:0 0 30px #8B0000; font-family:'Share Tech Mono', monospace; margin:50px 0;">
            00:00:00:00
        </div>
        
        <p style="color:#888; font-size:18px; margin-top:30px;">
            Something is coming...<br>
            You cannot escape...
        </p>
        
        <div style="margin-top:50px; padding:20px; background:#0D0D0D; border:1px solid #8B0000;">
            <p style="color:#8B0000; font-size:14px;">
                ⚠ WARNING: No-clipping detected in your area ⚠
            </p>
        </div>
    </div>

    <script>
        // Countdown - örnek olarak 30 gün sonra
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 30);
        
        function updateCountdown() {
            const now = new Date();
            const diff = targetDate - now;
            
            if (diff <= 0) {
                document.getElementById('countdown').innerHTML = '00:00:00:00';
                return;
            }
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById('countdown').innerHTML = 
                `${String(days).padStart(2, '0')}:${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }
        
        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>

</body>
</html>
