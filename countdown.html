<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown - Saint 𖤐 sinneR</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #000 url('backroooms.png') center/cover no-repeat;
            animation: blackout 4s infinite;
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
        }
        @keyframes blackout {
            0%, 45%, 55%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .countdown-container {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .countdown-text {
            font-family: 'Creepster', cursive;
            font-size: 72px;
            color: #fff;
            text-shadow: 0 0 30px #8B0000, 0 0 50px #8B0000;
            animation: flicker 0.8s infinite;
        }
        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <header class="fixed-header">
        <div class="logo">Saint 𖤐 sinneR</div>
        <div class="main-buttons" style="position:absolute; top:80px; right:20px;">
            <button onclick="location.href='index.html'">Main Page</button>
        </div>
    </header>
    
    <div class="countdown-container">
        <div class="countdown-text">BACKROOMS IS OUT!</div>
    </div>
</body>
</html>
