<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown - Saint 𖤐 sinneR</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        /* ===== KALIN SABİT HEADER (ÇAKIŞMA YOK) ===== */
        .fixed-header {
            position: fixed !important;
            top: 0 !important;
            width: 100% !important;
            background: rgba(0,0,0,.95) !important;
            border-bottom: 4px solid #8B0000 !important; /* DAHA KALIN */
            padding: 30px 0 !important; /* DAHA KALIN */
            z-index: 1000 !important;
        }
        
        .fixed-header .logo {
            font-size: 54px !important; /* 1.5X */
            top: 25px !important;
        }

        .fixed-header .main-buttons {
            top: 110px !important; /* Butonları aşağı al */
        }

        /* ===== YAZI 1.5X BÜYÜK (108px) ===== */
        .countdown-text {
            font-size: 108px !important; /* 1.5X (eski 72px) */
            color: #fff !important;
            text-shadow: 0 0 45px #8B0000 !important;
        }

        /* ===== ARKAPLAN BAŞLANGIÇTA KAPALI ===== */
        .animated-background {
            opacity: 0 !important;
        }

        /* ===== FLICKER ===== */
        @keyframes broken-flicker {
            0%, 100% { opacity: 1 !important; }
            50% { opacity: 0.2 !important; }
        }

        .text-flicker {
            animation: broken-flicker 0.5s 2 !important;
        }

        .bg-flicker {
            animation: broken-flicker 0.5s 2 !important;
        }
        
        /* ===== SİYAH ARKAPLAN ===== */
        body {
            background: #000 !important;
        }
    </style>
</head>
<body>
    <!-- SABİT HEADER -->
    <header class="fixed-header">
        <div class="logo">Saint 𖤐 sinneR</div>
        <div class="main-buttons" style="position:absolute; right: 20px;">
            <button onclick="location.href='countdown.html'" style="font-size: 24px;">Countdown</button>
        </div>
        <div class="main-buttons" style="position:absolute; top: 110px; right: 20px;">
            <button onclick="location.href='index.html'" style="font-size: 24px;">Main Page</button>
        </div>
    </header>

    <!-- YAZI -->
    <div class="countdown-container">
        <div class="countdown-text" id="countdown-text">BACKROOMS IS OUT!</div>
    </div>

    <!-- ARKAPLAN -->
    <div class="animated-background" id="animated-background"></div>

    <!-- ZAMANLAYICI -->
    <script>
        const textElement = document.getElementById('countdown-text');
        const bgElement = document.getElementById('animated-background');

        function startCountdownEffect() {
            // 3500ms: Yazıya efect (3 sn sürer)
            setTimeout(() => {
                textElement.classList.add('text-flicker');
                
                setTimeout(() => {
                    textElement.classList.remove('text-flicker');
                    
                    // 5000ms: Arkaplan açılır + efect (1 sn sürer)
                    setTimeout(() => {
                        bgElement.style.opacity = '1';
                        bgElement.classList.add('bg-flicker');
                        
                        setTimeout(() => {
                            bgElement.classList.remove('bg-flicker');
                            
                            // 6000ms: İkisi beraber (1 sn sürer)
                            setTimeout(() => {
                                textElement.classList.add('text-flicker');
                                bgElement.classList.add('bg-flicker');
                                
                                // 6500ms: Her şey düzelir
                                setTimeout(() => {
                                    textElement.classList.remove('text-flicker');
                                    bgElement.classList.remove('bg-flicker');
                                    bgElement.style.opacity = '0';
                                }, 1000);
                            }, 500);
                        }, 500);
                    }, 500);
                }, 3000);
            }, 3500);
        }

        window.addEventListener('load', () => {
            setTimeout(startCountdownEffect, 1000);
        });

        setInterval(startCountdownEffect, 8500);
    </script>
</body>
</html>
