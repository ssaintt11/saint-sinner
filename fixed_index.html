<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saint 𖤐 sinneR</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="crt"></div>
    
    <!-- Sabit Header -->
    <header class="fixed-header">
        <div class="logo">Saint 𖤐 sinneR</div>
        
        <!-- Üst Butonlar (Login/Register) -->
        <div class="top-buttons">
            <button onclick="showLogin()" style="font-size: 24px;">Login</button>
            <button onclick="showRegister()" style="font-size: 24px;">Register</button>
        </div>
        
        <!-- Alt Butonlar (Navigasyon) -->
        <div class="main-buttons">
            <button onclick="location.href='index.html'" style="font-size: 32px;">Main Page</button>
            <button onclick="location.href='countdown.html'" style="font-size: 32px;">Countdown</button>
            <button onclick="alert('Blog coming soon')" style="font-size: 32px;">Blog</button>
            <button class="forgive-btn" onclick="openForgive()" style="font-size: 32px;">Forgive My Sins</button>
        </div>
    </header>

    <!-- Ana İçerik Alanı -->
    <main class="content-grid" id="content-grid">
        <h2 style="text-align:center; margin-top:150px; color:#fff; font-family:'Share Tech Mono', monospace; font-size:32px;">Posts will appear here</h2>
    </main>

    <!-- Forgive Popup -->
    <div id="forgive-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeForgive()">&times;</span>
            <h2 style="font-size:48px;">Seek Redemption</h2>
            <p style="color: #ccc; margin-bottom: 20px; font-size: 18px;">Choose your path to salvation...</p>
            <button class="glitch-btn" onclick="location.href='apologize.html'">Click to Apologize</button>
            <button class="fake-btn" onclick="alert('There is no easy way to salvation...')">Click to be Saved</button>
            <button class="fake-btn" onclick="alert('Forgiveness must be earned...')">Click to Forgive</button>
            <button class="fake-btn" onclick="alert('Some memories never fade...')">Click to Forget</button>
            <button class="fake-btn" onclick="alert('Purity is a lie we tell ourselves...')">Click to be Pure</button>
        </div>
    </div>

    <!-- Login Popup -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeLogin()">&times;</span>
            <h2 style="font-size:48px;">Enter the Void</h2>
            <input type="text" id="login-nickname" placeholder="Church Nickname">
            <input type="password" id="login-password" placeholder="Password">
            <button class="glitch-btn" onclick="login()">Descend</button>
            <p style="color: #666; font-size: 14px; margin-top: 15px;">Don't have an account? <a href="#" onclick="closeLogin(); showRegister();" style="color: #8B0000;">Register here</a></p>
        </div>
    </div>

    <!-- Register Popup -->
    <div id="register-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeRegister()">&times;</span>
            <h2 style="font-size:48px;">Join the Congregation</h2>
            <input type="text" id="reg-nickname" placeholder="Church Nickname">
            <input type="password" id="reg-password" placeholder="Password">
            <button class="glitch-btn" onclick="register()">Submit</button>
            <p style="color: #666; font-size: 14px; margin-top: 15px;">Already have an account? <a href="#" onclick="closeRegister(); showLogin();" style="color: #8B0000;">Login here</a></p>
        </div>
    </div>

    <!-- Script Dosyaları -->
    <script src="auth.js"></script>
    <script src="gallery.js"></script>
</body>
</html>
