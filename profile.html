<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Saint 𖤐 sinneR</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body style="background:#000 url('ravenn.png') center/cover no-repeat fixed; min-height:100vh;">
    
    <!-- HEADER -->
    <header class="fixed-header" style="padding:60px 0;">
        <div class="logo" style="font-size:48px; cursor:pointer;" onclick="location.href='index.html'">Saint 𖤐 sinneR</div>
        <div class="top-buttons">
            <button class="backrooms-btn" onclick="location.href='profile.html'">Profile</button>
            <button class="backrooms-btn" onclick="logout()">Logout</button>
        </div>
        <div class="main-buttons" style="top:110px;">
            <button class="backrooms-btn" onclick="location.href='index.html'">Main Page</button>
            <button class="backrooms-btn" onclick="location.href='countdown.html'">Countdown</button>
            <button class="backrooms-btn" onclick="alert('Blog coming soon')">Blog</button>
            <button class="backrooms-btn" onclick="location.href='forgive.html'">Forgive My Sins</button>
        </div>
    </header>

    <!-- PROFILE CONTAINER (25% - 75% KOLON) -->
    <div style="max-width:1200px; margin:150px auto 50px; padding:0 20px; display:flex; gap:30px;">
        
        <!-- SOL SÜTUN (25% - SIDEBAR) -->
        <aside style="width:25%; background:var(--koyu-gri); border:2px solid var(--koyu-kirmizi); padding:20px; height:fit-content;">
            
            <!-- PROFİL KARTI -->
            <div style="text-align:center; padding:20px; border:1px solid var(--koyu-kirmizi); margin-bottom:30px;">
                <img id="profile-avatar" src="https://placehold.co/100x100/1A1A1A/8B0000?text=?" 
                     style="width:100px; height:100px; border-radius:50%; border:2px solid var(--koyu-kirmizi); margin-bottom:15px; object-fit:cover;">
                <h3 id="profile-username" style="color:#fff; font-family:'Creepster', cursive; font-size:24px; margin:5px 0; text-shadow:0 0 5px #8B0000;">Loading...</h3>
                <p id="profile-title" style="color:#8B0000; font-family:'Share Tech Mono', monospace; font-size:14px; margin:0;">!000</p>
            </div>
            
            <!-- MENÜ LİSTESİ (SADECE "HESABIM" AKTİF) -->
            <nav>
                <ul style="list-style:none; padding:0; margin:0;">
                    <li style="margin-bottom:10px;">
                        <button class="menu-item active" onclick="location.href='profile.html'" style="width:100%; text-align:left; padding:10px; background:var(--koyu-siyah); border:1px solid var(--koyu-kirmizi); color:#fff; font-family:'Share Tech Mono', monospace; cursor:pointer;">Account</button>
                    </li>
                    <li style="margin-bottom:10px;">
                        <button class="menu-item" style="width:100%; text-align:left; padding:10px; background:var(--koyu-gri); border:1px solid #333; color:#666; font-family:'Share Tech Mono', monospace; cursor:not-allowed;" disabled>Orders</button>
                    </li>
                    <li style="margin-bottom:10px;">
                        <button class="menu-item" style="width:100%; text-align:left; padding:10px; background:var(--koyu-gri); border:1px solid #333; color:#666; font-family:'Share Tech Mono', monospace; cursor:not-allowed;" disabled>Addresses</button>
                    </li>
                    <li style="margin-bottom:10px;">
                        <button class="menu-item" style="width:100%; text-align:left; padding:10px; background:var(--koyu-gri); border:1px solid #333; color:#666; font-family:'Share Tech Mono', monospace; cursor:not-allowed;" disabled>Wallet</button>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- SAĞ SÜTUN (75% - ANA İÇERİK) -->
        <main style="width:75%; background:var(--koyu-gri); border:2px solid var(--koyu-kirmizi); padding:30px;">
            
            <!-- BAŞLIK ve BUTONLAR -->
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
                <div>
                    <h1 style="color:#fff; font-family:'Creepster', cursive; font-size:48px; margin:0; text-shadow:0 0 10px #8B0000;">Account</h1>
                    <p style="color:#ccc; font-family:'Share Tech Mono', monospace; font-size:14px; margin:5px 0;">View and edit your personal information below.</p>
                </div>
                <button id="update-btn" class="glitch-btn" style="font-size:18px; padding:10px 20px;">Update</button>
            </div>
            
            <!-- FORMLAR -->
            <form id="profile-form">
                
                <!-- GÖRÜNEN AD -->
                <div style="margin-bottom:30px;">
                    <label style="color:#fff; font-family:'Share Tech Mono', monospace; font-size:16px; display:block; margin-bottom:10px;">Display Name</label>
                    <input type="text" id="display-name" placeholder="Your display name" 
                           style="font-size:18px; width:100%; padding:12px; background:transparent; border:none; border-bottom:1px solid var(--koyu-kirmizi); color:var(--beyaz); font-family:'Share Tech Mono', monospace;">
                </div>
                
                <!-- BAŞLIK (!987 gibi) -->
                <div style="margin-bottom:30px;">
                    <label style="color:#fff; font-family:'Share Tech Mono', monospace; font-size:16px; display:block; margin-bottom:10px;">Title (e.g., !987)</label>
                    <input type="text" id="profile-title-input" placeholder="Your custom title" 
                           style="font-size:18px; width:100%; padding:12px; background:transparent; border:none; border-bottom:1px solid var(--koyu-kirmizi); color:var(--beyaz); font-family:'Share Tech Mono', monospace;">
                </div>
                
                <!-- PROFİL RESMİ YÜKLEME -->
                <div style="margin-bottom:30px;">
                    <label style="color:#fff; font-family:'Share Tech Mono', monospace; font-size:16px; display:block; margin-bottom:10px;">Profile Picture</label>
                    <div style="display:flex; align-items:center; gap:20px;">
                        <img id="avatar-preview" src="https://placehold.co/80x80/1A1A1A/8B0000?text=?" 
                             style="width:80px; height:80px; border-radius:50%; border:2px solid var(--koyu-kirmizi);">
                        <input type="file" id="avatar-upload" accept="image/*" 
                               style="font-family:'Share Tech Mono', monospace; color:#fff;">
                    </div>
                </div>
                
            </form>
            
            <!-- UYARI MESAJI -->
            <div style="margin-top:40px; padding:15px; background:var(--koyu-siyah); border:1px solid var(--koyu-kirmizi);">
                <p style="color:#8B0000; font-family:'Share Tech Mono', monospace; font-size:12px; margin:0;">⚠️ This information is visible to all members of the site.</p>
            </div>
            
        </main>
    </div>

    <!-- SUPABASE CONNECTION -->
    <script>
        // Kullanıcı oturum kontrolü
        let currentUser = null;
        let originalData = {};

        async function loadProfile() {
            const { data: { user } } = await window.supabase.auth.getUser();
            
            if (!user) {
                alert('Please login first!');
                window.location.href = 'login.html';
                return;
            }
            
            currentUser = user;
            
            // Profil bilgilerini getir
            const { data: profile, error } = await window.supabase
                .from('profiles')
                .select('*')
                .eq('id', user.id)
                .single();
            
            if (error) {
                console.error('Profile error:', error);
                return;
            }
            
            // Form alanlarını doldur
            document.getElementById('profile-username').textContent = profile.username || 'Unknown';
            document.getElementById('profile-title').textContent = profile.title || '!000';
            document.getElementById('profile-title-input').value = profile.title || '';
            document.getElementById('display-name').value = profile.display_name || '';
            
            // Avatar
            if (profile.avatar_url) {
                document.getElementById('profile-avatar').src = profile.avatar_url;
                document.getElementById('avatar-preview').src = profile.avatar_url;
            }
            
            // Orijinal verileri kaydet
            originalData = {
                display_name: profile.display_name || '',
                title: profile.title || '',
                avatar_url: profile.avatar_url || ''
            };
        }

        // Sayfa yüklendiğinde profili getir
        loadProfile();

        // Avatar yükleme
        document.getElementById('avatar-upload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const fileExt = file.name.split('.').pop();
            const fileName = `${currentUser.id}.${fileExt}`;
            const filePath = `avatars/${fileName}`;
            
            // Yeni avatarı yükle
            const { error: uploadError } = await window.supabase.storage
                .from('avatars')
                .upload(filePath, file);
            
            if (uploadError) {
                alert('Upload failed: ' + uploadError.message);
                return;
            }
            
            // URL al
            const { data } = window.supabase.storage.from('avatars').getPublicUrl(filePath);
            const publicURL = data.publicUrl;
            
            // Preview güncelle
            document.getElementById('profile-avatar').src = publicURL;
            document.getElementById('avatar-preview').src = publicURL;
            
            // Kaydet için hazırla
            originalData.avatar_url = publicURL;
        });

        // Güncelle butonu
        document.getElementById('update-btn').addEventListener('click', async () => {
            const displayName = document.getElementById('display-name').value;
            const title = document.getElementById('profile-title-input').value;
            
            const { error } = await window.supabase.from('profiles').update({
                display_name: displayName,
                title: title,
                avatar_url: originalData.avatar_url
            }).eq('id', currentUser.id);
            
            if (error) {
                alert('Update failed: ' + error.message);
            } else {
                alert('Profile updated successfully!');
                loadProfile(); // Yenile
            }
        });
    </script>

</body>
</html>
