<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Saint 𖤐 sinneR</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <header class="main-header">
        <div class="header-container">
            <div class="logo" onclick="location.href='index.html'">Saint 𖤐 sinneR</div>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="profile.html" class="nav-link active">Profile</a>
            </nav>
            <div class="auth-buttons">
                <button onclick="logout()" class="btn-outline">Logout</button>
            </div>
        </div>
    </header>

    <div class="container" style="margin-top: 140px;">
        <div class="profile-layout">
            <div class="profile-sidebar">
                <div class="profile-avatar-container">
                    <img id="avatar-display" src="https://placehold.co/150x150/1A1A1A/8B0000?text=?" class="profile-avatar-large">
                    <div class="profile-badge" id="user-title">!000</div>
                </div>
                <h2 id="display-username" style="text-align:center; margin-top:15px; font-family:'Creepster',cursive;">Loading...</h2>
            </div>
            
            <div class="profile-content">
                <h1 style="font-family:'Creepster',cursive; font-size:42px; margin-bottom:30px; text-shadow:0 0 10px #8B0000;">Edit Your Profile</h1>
                
                <form id="profile-form" class="profile-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" id="username" disabled style="opacity:0.6;">
                            <small style="color:#666;">Cannot be changed</small>
                        </div>
                        
                        <div class="form-group">
                            <label>Title</label>
                            <input type="text" id="title" placeholder="!666">
                            <small style="color:#666;">Your custom title</small>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Denomination</label>
                            <input type="text" id="denomination" placeholder="Your faith">
                        </div>
                        
                        <div class="form-group">
                            <label>Church</label>
                            <input type="text" id="church" placeholder="Your church">
                        </div>
                    </div>
                    
                    <div class="form-group" style="margin-top:20px;">
                        <label>Profile Picture</label>
                        <input type="file" id="avatar-upload" accept="image/*" style="background:transparent; padding:10px 0;">
                        <div id="upload-status" style="margin-top:10px; font-size:14px;"></div>
                    </div>
                    
                    <button type="submit" class="btn-glitch" style="margin-top:30px; padding:15px 40px; font-size:20px;">
                        UPDATE PROFILE
                    </button>
                </form>
                
                <div id="message" style="margin-top:20px;"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="auth.js"></script>
    <script>
        let currentUser = null;
        
        async function loadProfile() {
            const { data: { user } } = await window.supabase.auth.getUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            
            currentUser = user;
            
            const { data: profile, error } = await window.supabase
                .from('profiles')
                .select('*')
                .eq('id', user.id)
                .single();
            
            if (error) {
                alert('Error loading profile');
                return;
            }
            
            // Form doldur
            document.getElementById('username').value = profile.username || '';
            document.getElementById('title').value = profile.title || '';
            document.getElementById('denomination').value = profile.denomination || '';
            document.getElementById('church').value = profile.church || '';
            document.getElementById('display-username').textContent = profile.username;
            document.getElementById('user-title').textContent = profile.title || '!000';
            
            if (profile.avatar_url) {
                document.getElementById('avatar-display').src = profile.avatar_url;
            }
        }
        
        // Avatar yükleme
        document.getElementById('avatar-upload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const status = document.getElementById('upload-status');
            status.textContent = 'Uploading...';
            status.style.color = '#888';
            
            const fileExt = file.name.split('.').pop();
            const fileName = `${currentUser.id}-${Date.now()}.${fileExt}`;
            
            const { error: uploadError } = await window.supabase.storage
                .from('avatars')
                .upload(fileName, file);
            
            if (uploadError) {
                status.textContent = 'Upload failed: ' + uploadError.message;
                status.style.color = '#ff0000';
                return;
            }
            
            const { data } = window.supabase.storage.from('avatars').getPublicUrl(fileName);
            const publicUrl = data.publicUrl;
            
            // Profili güncelle
            await window.supabase.from('profiles').update({ avatar_url: publicUrl }).eq('id', currentUser.id);
            
            document.getElementById('avatar-display').src = publicUrl;
            status.textContent = 'Upload successful!';
            status.style.color = '#00ff00';
        });
        
        // Form gönderimi
        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('message');
            
            const updates = {
                title: document.getElementById('title').value || null,
                denomination: document.getElementById('denomination').value || null,
                church: document.getElementById('church').value || null
            };
            
            const { error } = await window.supabase
                .from('profiles')
                .update(updates)
                .eq('id', currentUser.id);
            
            if (error) {
                msg.innerHTML = `<span class="error-text">Error: ${error.message}</span>`;
            } else {
                msg.innerHTML = '<span class="success-text">Profile updated successfully!</span>';
                setTimeout(() => window.location.reload(), 1000);
            }
        });
        
        loadProfile();
    </script>
</body>
</html>
