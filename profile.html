<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Saint 𖤐 sinneR</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body style="background:#000 url('ravenn.png') center/cover no-repeat fixed; min-height:100vh;">
    
    <!-- HEADER -->
    <header class="fixed-header" style="padding:60px 0;">
        <div class="logo" style="font-size:48px; cursor:pointer;" onclick="location.href='index.html'">Saint 𖤐 sinneR</div>
        <div class="top-buttons">
            <button class="backrooms-btn" onclick="location.href='profile.html'">Profile</button>
            <button class="backrooms-btn" onclick="logout()">Logout</button>
        </div>
        <div class="main-buttons" style="top:110px;">
            <button class="backrooms-btn" onclick="location.href='index.html'">Main Page</button>
            <button class="backrooms-btn" onclick="location.href='countdown.html'">Countdown</button>
            <button class="backrooms-btn" onclick="alert('Blog coming soon')">Blog</button>
            <button class="backrooms-btn" onclick="location.href='forgive.html'">Forgive My Sins</button>
        </div>
    </header>

    <!-- PROFILE -->
    <div class="modal-content" style="margin:10% auto; max-width:500px;">
        <h2 style="font-size:48px; color:#fff; text-shadow:0 0 10px #8B0000; text-align:center; margin-bottom:30px;">WANDERER PROFILE</h2>
        
        <div id="profile-content">
            <p style="text-align:center; color:#888;">Loading profile...</p>
        </div>
    </div>

    <script>
        // Logout
        async function logout() {
            await window.supabase.auth.signOut();
            window.location.href = 'index.html';
        }
        
        // Profil yükle
        async function loadProfile() {
            const container = document.getElementById('profile-content');
            
            try {
                const { data: { user } } = await window.supabase.auth.getUser();
                
                if (!user) {
                    window.location.href = 'login.html';
                    return;
                }
                
                const { data: profile, error } = await window.supabase
                    .from('profiles')
                    .select('*')
                    .eq('id', user.id)
                    .single();
                
                if (error) {
                    container.innerHTML = `<p style="color:#8B0000; text-align:center;">Error: ${error.message}</p>`;
                    return;
                }
                
                container.innerHTML = `
                    <div style="background:#0D0D0D; border:2px solid #8B0000; padding:30px;">
                        <div style="text-align:center; margin-bottom:30px;">
                            <div style="width:100px; height:100px; background:#1A1A1A; border:3px solid #8B0000; border-radius:50%; margin:0 auto; display:flex; align-items:center; justify-content:center; font-size:48px;">
                                ☠
                            </div>
                        </div>
                        
                        <div style="margin-bottom:20px;">
                            <label style="color:#888; font-size:12px;">WANDERER NAME</label>
                            <p style="color:#fff; font-size:24px; margin:5px 0; font-family:'Creepster',cursive;">
                                ${escapeHtml(profile.username)}
                            </p>
                        </div>
                        
                        <div style="margin-bottom:20px;">
                            <label style="color:#888; font-size:12px;">LEVEL</label>
                            <p style="color:#8B0000; font-size:18px; margin:5px 0;">
                                ${escapeHtml(profile.denomination || 'Unknown')}
                            </p>
                        </div>
                        
                        <div style="margin-bottom:20px;">
                            <label style="color:#888; font-size:12px;">ENTITY ENCOUNTERED</label>
                            <p style="color:#fff; font-size:16px; margin:5px 0;">
                                ${escapeHtml(profile.church || 'None recorded')}
                            </p>
                        </div>
                        
                        <div style="margin-bottom:20px;">
                            <label style="color:#888; font-size:12px;">WANDERER ID</label>
                            <p style="color:#666; font-size:14px; margin:5px 0;">
                                ${escapeHtml(profile.title || 'Unknown')}
                            </p>
                        </div>
                        
                        <div style="margin-bottom:20px;">
                            <label style="color:#888; font-size:12px;">JOINED</label>
                            <p style="color:#666; font-size:14px; margin:5px 0;">
                                ${new Date(profile.created_at).toLocaleDateString()}
                            </p>
                        </div>
                        
                        <button onclick="location.href='index.html'" class="glitch-btn" style="width:100%; margin-top:20px;">
                            RETURN TO THE VOID
                        </button>
                    </div>
                `;
                
            } catch (error) {
                container.innerHTML = `<p style="color:#8B0000; text-align:center;">Error: ${error.message}</p>`;
            }
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        document.addEventListener('DOMContentLoaded', loadProfile);
    </script>

</body>
</html>
