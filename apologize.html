<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confess - Saint 𖤐 sinneR</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="crt"></div>
    
    <div class="modal-content" style="margin: 5% auto; max-width: 600px;">
        <h2>CONFESS YOUR SINS</h2>
        <input type="text" id="nickname" placeholder="Your Church Nickname">
        <textarea id="reason" placeholder="Why do you seek forgiveness?" rows="5"></textarea>
        
        <h3>Are you truly sorry?</h3>
        <div style="display:flex; gap:20px; justify-content:center; margin:20px 0;">
            <button class="glitch-btn" onclick="alert('Your sin has been noted...')">YES</button>
            <button class="glitch-btn" onclick="alert('There is no escape...')">NO</button>
        </div>
        
        <button class="glitch-btn" onclick="alert('God has heard you... maybe')">God Forgive Me</button>
    </div>
</body>
