<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confess - Saint 𖤐 sinneR</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="crt"></div>
    
    <header class="fixed-header">
        <div class="logo" style="font-size: 54px;">Saint 𖤐 sinneR</div>
        <div class="top-buttons">
            <button onclick="showLogin()" style="font-size: 24px;">Login</button>
            <button onclick="showRegister()" style="font-size: 24px;">Register</button>
        </div>
        <div class="main-buttons" style="top: 80px;">
            <button onclick="location.href='index.html'" style="font-size: 32px;">Main Page</button>
        </div>
    </header>
    
    <div class="modal-content" style="margin: 8% auto; max-width: 800px;">
        <h2 style="font-size: 72px;">CONFESS YOUR SINS</h2>
        <input type="text" id="nickname" placeholder="Your Church Nickname" style="font-size: 36px;">
        <textarea id="reason" placeholder="Why do you seek forgiveness?" rows="5" style="font-size: 36px;"></textarea>
        
        <h3 style="font-size: 54px;">Are you truly sorry?</h3>
        <div style="display:flex; gap:20px; justify-content:center; margin:30px 0;">
            <button class="glitch-btn" style="font-size: 48px;" onclick="alert('Your sin has been noted...')">YES</button>
            <button class="glitch-btn" style="font-size: 48px;" onclick="alert('There is no escape...')">NO</button>
        </div>
        
        <button class="glitch-btn" style="font-size: 48px;" onclick="alert('God has heard you... maybe')">God Forgive Me</button>
    </div>
</body>
</html>
