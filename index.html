<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saint 𖤐 sinneR</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="crt"></div>
    <header class="fixed-header">
        <div class="logo">Saint 𖤐 sinneR</div>
        <div class="header-right">
            <div id="auth-buttons">
                <button onclick="showLogin()">Login</button>
                <button onclick="showRegister()">Register</button>
            </div>
            <div id="profile-section" style="display:none;">
                <a href="profile.html">My Profile</a>
                <button onclick="logout()">Logout</button>
            </div>
            <button class="forgive-btn" onclick="openForgive()">Forgive My Sins</button>
        </div>
    </header>

    <div id="forgive-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeForgive()">&times;</span>
            <h2>Seek Redemption</h2>
            <button class="glitch-btn" onclick="location.href='apologize.html'">Click to Apologize</button>
            <p class="fake-link">Click to be Saved</p>
            <p class="fake-link">Click to Forgive</p>
            <p class="fake-link">Click to Forget</p>
            <p class="fake-link">Click to be Pure</p>
        </div>
    </div>

    <div id="login-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeLogin()">&times;</span>
            <h2>Enter the Void</h2>
            <input type="text" id="login-nickname" placeholder="Church Nickname">
            <input type="password" id="login-password" placeholder="Password">
            <button onclick="login()">Descend</button>
        </div>
    </div>

    <div id="register-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeRegister()">&times;</span>
            <h2>Join the Congregation</h2>
            <input type="text" id="reg-nickname" placeholder="Church Nickname">
            <input type="password" id="reg-password" placeholder="Password">
            <div class="role-buttons">
                <button onclick="selectRole('sinner')">I am a Sinner</button>
                <button onclick="selectRole('pious')">I am Pious</button>
            </div>
            <p id="selected-role" style="color:#8B0000; margin:10px 0;"></p>
            <button onclick="register()">Submit</button>
        </div>
    </div>

    <main class="content-grid" id="content-grid">
        <!-- İçerikler buraya gelecek -->
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="gallery.js"></script>
</body>
</html>
