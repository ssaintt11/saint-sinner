<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saint 𖤐 sinneR</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="crt"></div>
    
    <header class="fixed-header">
        <div class="logo">Saint 𖤐 sinneR</div>
        
        <!-- ÜST BUTONLAR -->
        <div class="top-buttons">
            <button onclick="showLogin()">Login</button>
            <button onclick="showRegister()">Register</button>
        </div>
        
        <!-- ALT BUTONLAR -->
        <div class="main-buttons">
            <button onclick="location.href='index.html'">Main Page</button>
            <button onclick="location.href='countdown.html'">Countdown</button>
            <button onclick="alert('Blog coming soon')">Blog</button>
            <button class="forgive-btn" onclick="openForgive()">Forgive My Sins</button>
        </div>
    </header>

    <!-- İÇERİK -->
    <main>
        <h2 style="text-align:center; margin-top:150px; font-size:32px;">Posts will appear here</h2>
    </main>

    <!-- POPUP'LAR -->
    <div id="forgive-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeForgive()">&times;</span>
            <h2>Seek Redemption</h2>
            <button class="glitch-btn" onclick="location.href='apologize.html'">Click to Apologize</button>
            <button class="fake-btn">Click to be Saved</button>
            <button class="fake-btn">Click to Forgive</button>
            <button class="fake-btn">Click to Forget</button>
            <button class="fake-btn">Click to be Pure</button>
        </div>
    </div>

    <div id="login-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeLogin()">&times;</span>
            <h2>Enter the Void</h2>
            <input type="text" id="login-nickname" placeholder="Church Nickname">
            <input type="password" id="login-password" placeholder="Password">
            <button class="glitch-btn" onclick="login()">Descend</button>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
