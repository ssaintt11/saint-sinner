<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saint 𖤐 sinneR</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <header class="fixed-header" style="padding:40px 0;">
        <div class="logo" style="font-size:48px;">Saint 𖤐 sinneR</div>
        
        <!-- ÜST BUTONLAR -->
        <div class="top-buttons">
            <button onclick="showLogin()" style="font-size:16px;">Login</button>
            <button onclick="showRegister()" style="font-size:16px;">Register</button>
        </div>
        
        <!-- ALT BUTONLAR -->
        <div class="main-buttons" style="top:90px;">
            <button onclick="location.href='index.html'" style="font-size:16px;">Main Page</button>
            <button onclick="location.href='countdown.html'" style="font-size:16px;">Countdown</button>
            <button onclick="alert('Blog coming soon')" style="font-size:16px;">Blog</button>
            <button class="forgive-btn" onclick="openForgive()" style="font-size:16px;">Forgive My Sins</button>
        </div>
    </header>

    <main>
        <h2 style="text-align:center; margin-top:150px; font-size:32px;">Posts will appear here</h2>
    </main>

    <!-- POPUP'LAR -->
    <div id="forgive-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeForgive()">&times;</span>
            <h2 style="font-size:48px;">Seek Redemption</h2>
            <button class="glitch-btn" onclick="location.href='apologize.html'">Click to Apologize</button>
            <button class="fake-btn">Click to be Saved</button>
            <button class="fake-btn">Click to Forgive</button>
            <button class="fake-btn">Click to Forget</button>
            <button class="fake-btn">Click to be Pure</button>
        </div>
    </div>

    <div id="login-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeLogin()">&times;</span>
            <h2 style="font-size:48px;">Enter the Void</h2>
            <input type="text" id="login-nickname" placeholder="Church Nickname">
            <input type="password" id="login-password" placeholder="Password">
            <button class="glitch-btn" onclick="login()">Descend</button>
        </div>
    </div>

    <div id="register-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeRegister()">&times;</span>
            <h2 style="font-size:48px;">Join the Congregation</h2>
            <input type="text" id="reg-nickname" placeholder="Church Nickname">
            <input type="password" id="reg-password" placeholder="Password">
            <button class="glitch-btn" onclick="register()">Submit</button>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
