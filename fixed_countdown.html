<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown - Saint 𖤐 sinneR</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        /* Sadece countdown'a özel stiller - Header tekrar tanımlanmamış */
        .countdown-container {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        .countdown-text {
            font-family: 'Creepster', cursive;
            font-size: 144px;
            color: #fff;
            text-shadow: 0 0 60px #8B0000;
            opacity: 1;
            text-align: center;
        }

        /* Arkaplan başlangıçta görünmez */
        .animated-background {
            position: fixed;
            inset: 0;
            background: #000 url('backroooms.png') center/cover no-repeat;
            opacity: 0;
            z-index: 1;
        }

        /* Flicker animasyonu */
        @keyframes broken-flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .text-flicker {
            animation: broken-flicker 0.5s 2;
        }

        .bg-flicker {
            animation: broken-flicker 0.5s 2;
        }
        
        /* Siyah arkaplan */
        body {
            background: #000 !important;
        }

        /* Responsive tasarım */
        @media (max-width: 768px) {
            .countdown-text {
                font-size: 60px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Sabit Header -->
    <header class="fixed-header">
        <div class="logo" style="font-size: 72px;">Saint 𖤐 sinneR</div>
        <div class="top-buttons">
            <button onclick="showLogin()" style="font-size: 24px;">Login</button>
            <button onclick="showRegister()" style="font-size: 24px;">Register</button>
        </div>
        <div class="main-buttons" style="top: 80px;">
            <button onclick="location.href='index.html'" style="font-size: 32px;">Main Page</button>
        </div>
    </header>

    <!-- Countdown Yazısı -->
    <div class="countdown-container">
        <div class="countdown-text" id="countdown-text">BACKROOMS IS OUT!</div>
    </div>

    <!-- Arkaplan -->
    <div class="animated-background" id="animated-background"></div>

    <!-- Login Popup -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeLogin()">&times;</span>
            <h2 style="font-size:48px;">Enter the Void</h2>
            <input type="text" id="login-nickname" placeholder="Church Nickname">
            <input type="password" id="login-password" placeholder="Password">
            <button class="glitch-btn" onclick="login()">Descend</button>
        </div>
    </div>

    <!-- Register Popup -->
    <div id="register-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeRegister()">&times;</span>
            <h2 style="font-size:48px;">Join the Congregation</h2>
            <input type="text" id="reg-nickname" placeholder="Church Nickname">
            <input type="password" id="reg-password" placeholder="Password">
            <button class="glitch-btn" onclick="register()">Submit</button>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        const textElement = document.getElementById('countdown-text');
        const bgElement = document.getElementById('animated-background');

        function startCountdownEffect() {
            // 3500ms: Yazıya efekt (3 sn sürer)
            setTimeout(() => {
                textElement.classList.add('text-flicker');
                
                setTimeout(() => {
                    textElement.classList.remove('text-flicker');
                    
                    // 5000ms: Arkaplan açılır + efekt (1 sn sürer)
                    setTimeout(() => {
                        bgElement.style.opacity = '1';
                        bgElement.classList.add('bg-flicker');
                        
                        setTimeout(() => {
                            bgElement.classList.remove('bg-flicker');
                            
                            // 6000ms: İkisi beraber (1 sn sürer)
                            setTimeout(() => {
                                textElement.classList.add('text-flicker');
                                bgElement.classList.add('bg-flicker');
                                
                                // 6500ms: Her şey düzelir
                                setTimeout(() => {
                                    textElement.classList.remove('text-flicker');
                                    bgElement.classList.remove('bg-flicker');
                                    bgElement.style.opacity = '0'; /* Arkaplan kapanır */
                                }, 1000);
                            }, 500);
                        }, 500);
                    }, 500);
                }, 3000);
            }, 3500);
        }

        window.addEventListener('load', () => {
            setTimeout(startCountdownEffect, 1000);
        });

        setInterval(startCountdownEffect, 8500);
    </script>
</body>
</html>
