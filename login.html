<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Saint 𖤐 sinneR</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- SUPABASE CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>
<body style="background:#000 url('ravenn.png') center/cover no-repeat fixed; min-height:100vh;">
    
    <!-- HEADER -->
    <header class="fixed-header" style="padding:60px 0;">
        <div class="logo" style="font-size:48px;" onclick="location.href='index.html'">Saint 𖤐 sinneR</div>
        <div class="top-buttons">
            <button class="backrooms-btn" onclick="location.href='login.html'">Login</button>
            <button class="backrooms-btn" onclick="location.href='register.html'">Register</button>
        </div>
        <div class="main-buttons" style="top:110px;">
            <button class="backrooms-btn" onclick="location.href='index.html'">Main Page</button>
            <button class="backrooms-btn" onclick="location.href='countdown.html'">Countdown</button>
            <button class="backrooms-btn" onclick="alert('Blog coming soon')">Blog</button>
            <button class="backrooms-btn" onclick="location.href='forgive.html'">Forgive My Sins</button>
        </div>
    </header>

    <!-- LOGIN FORM -->
    <div class="modal-content" style="margin:10% auto; max-width:400px; background:var(--koyu-gri); border:2px solid var(--koyu-kirmizi); padding:30px;">
        
        <h2 style="font-size:36px; color:#fff; text-shadow:0 0 10px #8B0000; text-align:center; margin-bottom:30px; font-family:'Creepster',cursive;">
            ENTER THE VOID
        </h2>
        <p style="text-align:center; color:#888; margin-bottom:20px; font-size:14px;">
            No clipping through reality...
        </p>
        
        <form id="login-form">
            <input type="text" id="login-username" placeholder="Your Wanderer Name" required 
                   style="font-size:18px; width:100%; padding:12px; margin:15px 0; background:var(--koyu-gri); border:1px solid var(--koyu-kirmizi); color:var(--beyaz); font-family:'Share Tech Mono', monospace;">
            
            <input type="password" id="login-password" placeholder="Access Code" required 
                   style="font-size:18px; width:100%; padding:12px; margin:15px 0; background:var(--koyu-gri); border:1px solid var(--koyu-kirmizi); color:var(--beyaz); font-family:'Share Tech Mono', monospace;">
            
            <button type="submit" class="glitch-btn" style="width:100%; font-size:24px; margin-top:20px;">NO CLIP</button>
        </form>
        
        <div id="login-message" style="margin-top:20px; text-align:center; color:#fff; font-family:'Share Tech Mono', monospace;"></div>
        
        <p style="text-align:center; margin-top:20px; color:#fff; font-family:'Share Tech Mono', monospace;">
            New wanderer? <a href="register.html" style="color:#8B0000; text-shadow:0 0 5px #8B0000;">Join the Lost</a>
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('login-form');
            
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const username = document.getElementById('login-username').value.trim();
                const password = document.getElementById('login-password').value;
                
                if (!username || !password) {
                    document.getElementById('login-message').innerHTML = 
                        `<p style="color: #8B0000; text-shadow:0 0 5px #8B0000;">Enter both fields...</p>`;
                    return;
                }
                
                try {
                    // Username'den email oluştur
                    const fakeEmail = `${username.toLowerCase().replace(/\s/g, '_')}@saint-sinner.void`;
                    
                    // Giriş yap
                    const { data, error } = await window.supabase.auth.signInWithPassword({
                        email: fakeEmail,
                        password: password
                    });
                    
                    if (error) {
                        // Eğer kullanıcı bulunamazsa, profiles tablosunda ara
                        const { data: profile } = await window.supabase
                            .from('profiles')
                            .select('id')
                            .eq('username', username)
                            .single();
                        
                        if (!profile) {
                            document.getElementById('login-message').innerHTML = 
                                `<p style="color: #8B0000; text-shadow:0 0 5px #8B0000;">Wanderer not found...</p>`;
                            return;
                        }
                        
                        document.getElementById('login-message').innerHTML = 
                            `<p style="color: #8B0000; text-shadow:0 0 5px #8B0000;">Wrong access code...</p>`;
                        return;
                    }
                    
                    document.getElementById('login-message').innerHTML = 
                        `<p style="color: #00FF00; text-shadow:0 0 5px #00FF00;">Welcome to the Backrooms...</p>`;
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                    
                } catch (error) {
                    console.error('Login error:', error);
                    document.getElementById('login-message').innerHTML = 
                        `<p style="color: #8B0000; text-shadow:0 0 5px #8B0000;">Error: ${error.message}</p>`;
                }
            });
        });
    </script>

</body>
</html>
