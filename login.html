<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Saint 𖤐 sinneR</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <header class="main-header">
        <div class="header-container">
            <div class="logo" onclick="location.href='index.html'">Saint 𖤐 sinneR</div>
        </div>
    </header>

    <div class="auth-container">
        <div class="auth-card" style="max-width:500px;">
            <h1 class="auth-title">JOIN THE CONGREGATION</h1>
            <p class="auth-subtitle">Confess your sins to enter...</p>
            
            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label>Username *</label>
                    <input type="text" id="username" required placeholder="Choose a unique username">
                </div>
                
                <div class="form-group">
                    <label>Denomination *</label>
                    <input type="text" id="denomination" required placeholder="Catholic, Orthodox, etc.">
                </div>
                
                <div class="form-group">
                    <label>Church (Optional)</label>
                    <input type="text" id="church" placeholder="Your local church">
                </div>
                
                <div class="form-group">
                    <label>Password * (min 6 chars)</label>
                    <input type="password" id="password" required minlength="6" placeholder="Create a password">
                </div>
                
                <button type="submit" class="btn-glitch" style="width:100%; margin-top:20px; padding:15px; font-size:24px;">
                    REGISTER
                </button>
            </form>
            
            <div id="message" class="auth-message"></div>
            
            <p style="text-align:center; margin-top:20px; color:#888; font-size:14px;">
                Already a member? <a href="login.html" style="color:#8B0000; font-weight:bold;">Login here</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('message');
            msg.innerHTML = 'Creating your account...';
            
            const username = document.getElementById('username').value.trim();
            const denomination = document.getElementById('denomination').value.trim();
            const church = document.getElementById('church').value.trim();
            const password = document.getElementById('password').value;
            
            // Basit validasyon
            if (username.length < 3) {
                msg.innerHTML = '<span class="error-text">Username must be at least 3 characters</span>';
                return;
            }
            
            // Email formatı oluştur (unique olmalı)
            const email = `${username.toLowerCase()}@saint-sinner.internal`;
            
            try {
                // 1. Auth kaydı
                const { data: authData, error: authError } = await window.supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: { username: username }
                    }
                });
                
                if (authError) {
                    if (authError.message.includes('already')) {
                        msg.innerHTML = '<span class="error-text">This username is already taken</span>';
                    } else {
                        msg.innerHTML = `<span class="error-text">${authError.message}</span>`;
                    }
                    return;
                }
                
                if (!authData.user) {
                    msg.innerHTML = '<span class="error-text">Registration failed. Try again.</span>';
                    return;
                }
                
                // 2. Profil tablosuna ekle
                const { error: profileError } = await window.supabase.from('profiles').insert({
                    id: authData.user.id,
                    username: username,
                    denomination: denomination,
                    church: church || null,
                    title: `!${Math.floor(Math.random() * 900000) + 100000}`
                });
                
                if (profileError) {
                    // Profil hatası durumunda auth'u silmeye çalış (temizlik için)
                    await window.supabase.auth.signOut();
                    msg.innerHTML = `<span class="error-text">Profile creation failed: ${profileError.message}</span>`;
                    return;
                }
                
                msg.innerHTML = '<span class="success-text">Account created! Redirecting to the void...</span>';
                setTimeout(() => {
                    window.location.href = 'profile.html';
                }, 1500);
                
            } catch (err) {
                msg.innerHTML = `<span class="error-text">System error: ${err.message}</span>`;
            }
        });
    </script>
</body>
</html>
