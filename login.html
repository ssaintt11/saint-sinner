<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Saint 𖤐 sinneR</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body style="background:#000 url('ravenn.png') center/cover no-repeat fixed; min-height:100vh;">
    
    <!-- HEADER (HER SAYFADA AYNI) -->
    <header class="fixed-header" style="padding:60px 0;">
        <div class="logo" style="font-size:48px;">Saint 𖤐 sinneR</div>
        <div class="top-buttons">
            <button class="backrooms-btn" onclick="location.href='login.html'">Login</button>
            <button class="backrooms-btn" onclick="location.href='register.html'">Register</button>
        </div>
        <div class="main-buttons" style="top:110px;">
            <button class="backrooms-btn" onclick="location.href='index.html'">Main Page</button>
            <button class="backrooms-btn" onclick="location.href='countdown.html'">Countdown</button>
            <button class="backrooms-btn" onclick="alert('Blog coming soon')">Blog</button>
            <button class="backrooms-btn" onclick="location.href='forgive.html'">Forgive My Sins</button>
        </div>
    </header>

    <!-- LOGIN FORM -->
    <div class="modal-content" style="margin:10% auto; max-width:400px; background:var(--koyu-gri); border:2px solid var(--koyu-kirmizi); padding:30px;">
        
        <h2 style="font-size:36px; color:#fff; text-shadow:0 0 10px #8B0000; text-align:center; margin-bottom:30px;">ENTER THE CHURCH</h2>
        
        <form id="login-form">
            <input type="text" id="login-username" placeholder="Takma Ad (Username)" required 
                   style="font-size:18px; width:100%; padding:12px; margin:15px 0; background:var(--koyu-gri); border:1px solid var(--koyu-kirmizi); color:var(--beyaz); font-family:'Share Tech Mono', monospace;">
            
            <input type="password" id="login-password" placeholder="Şifre (Password)" required 
                   style="font-size:18px; width:100%; padding:12px; margin:15px 0; background:var(--koyu-gri); border:1px solid var(--koyu-kirmizi); color:var(--beyaz); font-family:'Share Tech Mono', monospace;">
            
            <button type="submit" class="glitch-btn" style="width:100%; font-size:24px; margin-top:20px;">LOGIN</button>
        </form>
        
        <div id="login-message" style="margin-top:20px; text-align:center; color:#fff; font-family:'Share Tech Mono', monospace;"></div>
        
        <p style="text-align:center; margin-top:20px; color:#fff; font-family:'Share Tech Mono', monospace;">
            Henüz bir hesabın yok mu? <a href="register.html" style="color:#8B0000; text-shadow:0 0 5px #8B0000;">Kayıt Ol</a>
        </p>
    </div>

    <!-- SUPABASE CONNECTION -->
    <script type="module">
        import { supabase } from './supabase.js';

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            
            // 1. Username'den email'i bul
            const { data: userData, error: findError } = await supabase.rpc('login_with_username', {
                username_input: username,
                password_input: password
            });
            
            if (findError || userData.error) {
                document.getElementById('login-message').innerHTML = `<p style="color: #8B0000; text-shadow:0 0 5px #8B0000;">Error: ${findError?.message || userData.message}</p>`;
                return;
            }
            
            // 2. Email ve şifre ile giriş yap
            const { data, error } = await supabase.auth.signInWithPassword({
                email: userData.email,
                password: password
            });
            
            if (error) {
                document.getElementById('login-message').innerHTML = `<p style="color: #8B0000; text-shadow:0 0 5px #8B0000;">Login failed: ${error.message}</p>`;
            } else {
                document.getElementById('login-message').innerHTML = `<p style="color: #00FF00; text-shadow:0 0 5px #00FF00;">Welcome back, sinner! Redirecting...</p>`;
                setTimeout(() => {
                    window.location.href = 'profile.html';
                }, 1500);
            }
        });
    </script>

</body>
</html>
